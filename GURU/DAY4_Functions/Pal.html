<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number: "));
        function isPallindrome(num)
        {
            let temp = num;
            let sum = 0;
            let r;
            while(num != 0)
        {
            r = num%10;
            sum = sum*10+r;
            num = Math.floor(num/10);
        }

        if(sum === temp)
        {
            console.log("Its a pallindrome number");
        }
        else{
            console.log("Not a pallindrome number");
        }
        }
        isPallindrome(num)
    </script>
</body>
</html>
